<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CineBook - Staff login</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="/">Cine<span>Book</span></a><nav class="nav"><a class="navlink" href="/find.html">Find my booking</a><a class="navlink" href="/login.html">Staff login</a></nav></header>
  <main class="container narrow">
    <h1>Staff &amp; admin login</h1>
    <section class="card">
      <p class="empty">Customers don't need an account. This page is for cinema staff and admins only.</p>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" maxlength="150">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" maxlength="200">
        </div>
        <p id="login-error" class="notice bad" hidden></p>
        <button id="login-btn" class="btn" type="submit">Log in</button>
      </form>
      <p class="hint">Demo accounts: <code>admin@cinebook.test</code> / <code>admin123</code> and <code>staff@cinebook.test</code> / <code>staff123</code></p>
    </section>
  </main>
  <script src="/js/util.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
